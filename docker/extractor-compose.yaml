services:
  extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.extractor
    container_name: extractor
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - GCC_OPTIMIZATION=true
      - CC=gcc
      - CXX=g++
      - CFLAGS=-O3 -march=native
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ./collected_data:/app/collected_data
    restart: no
    # mem_limit: 4g
    # cpus: '2.0'
    networks:
      - ethereum-network

networks:
  ethereum-network:
    driver: bridge