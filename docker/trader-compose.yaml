version: '3.8'

services:
  trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.trader
    container_name: trader
    environment:
      - EXCHANGE_SANDBOX=true
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - MODEL_TRAINING=true
      - LIVE_EXTRACTION=true
      - TRADING_ENABLED=true
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
      - ../model-development:/app/model-development
      - ../catalog/src:/app/catalog/src
    restart: no
    ports:
      - "8000:8000"
    networks:
      - ethereum-network
    # mem_limit: 8g
    # cpus: '4.0'


networks:
  ethereum-network:
    driver: bridge